version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    # We do NOT expose ports directly here so traffic is forced through nginx
    deploy:
      # This allows scaling via `docker-compose up --scale api=4`
      mode: replicated
      replicas: 1

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - api

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      # Streamlit will call the Nginx load balancer
      - API_URL=http://nginx:80
    volumes:
      - ./data:/app/data
    depends_on:
      - nginx
